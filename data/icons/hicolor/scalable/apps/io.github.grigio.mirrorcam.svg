<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- dark rounded canvas, same shape as the app window -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1e1e1e"/>
  <clipPath id="lens">
    <circle cx="64" cy="72" r="14"/>
  </clipPath>
  <g fill="none" stroke="#78aeed" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- camera body with the top hump -->
    <path d="M28 48h12l8-10h32l8 10h12a8 8 0 0 1 8 8v32a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8z"/>
    <!-- lens -->
    <circle cx="64" cy="72" r="18"/>
  </g>
  <!-- mirrored lens: half filled, half hollow -->
  <rect x="46" y="58" width="18" height="28" fill="#78aeed" clip-path="url(#lens)"/>
</svg>
